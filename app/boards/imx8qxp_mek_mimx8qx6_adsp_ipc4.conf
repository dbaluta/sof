# IPC4 (major version 4) support for i.MX8QXP (HiFi4). Requires the matching
# IPC4 capable rimage config (imx8x_ipc4.toml) and an IPC4 topology on the host.
# This overlay is applied on top of the board default
# (imx8qxp_mek_mimx8qx6_adsp.conf).
CONFIG_IPC_MAJOR_4=y

# i.MX8QXP HiFi4 is single core; cross-core streaming is not applicable.
CONFIG_CROSS_CORE_STREAM=n
CONFIG_COMP_PEAK_VOL=n

# i.MX has no memory-window / DMA trace mechanism wired for IPC4.
CONFIG_TRACE=n

# NOTE: the i.MX8QM/QXP SAI IP has no MCLK-config register; the codec MCLK is
# supplied by the SCU-managed audio clock, not by a SAI MCLK output. So
# CONFIG_SAI_HAS_MCLK_CONFIG_OPTION / mclk-is-output are intentionally NOT set.
