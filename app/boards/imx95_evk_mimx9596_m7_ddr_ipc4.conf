# IPC4 (major version 4) support for i.MX95 (Cortex-M7). Requires the matching
# IPC4 capable rimage config (imx95_ipc4.toml) and an IPC4 topology on the host.
# This overlay is applied on top of the board default
# (imx95_evk_mimx9596_m7_ddr.conf).
CONFIG_IPC_MAJOR_4=y

# i.MX95 M7 is single core; cross-core streaming is not applicable.
CONFIG_CROSS_CORE_STREAM=n
CONFIG_COMP_PEAK_VOL=n

# i.MX has no memory-window / DMA trace mechanism wired for IPC4.
CONFIG_TRACE=n
