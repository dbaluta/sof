# IPC4 (major version 4) support for i.MX8ULP (HiFi4). Requires the matching
# IPC4 capable rimage config (imx8ulp_ipc4.toml) and an IPC4 topology on the
# host. This overlay is applied on top of the board default
# (imx8ulp_evk_mimx8ud7_adsp.conf).
CONFIG_IPC_MAJOR_4=y

# i.MX8ULP HiFi4 is single core; cross-core streaming is not applicable.
CONFIG_CROSS_CORE_STREAM=n
CONFIG_COMP_PEAK_VOL=n

# i.MX has no memory-window / DMA trace mechanism wired for IPC4.
CONFIG_TRACE=n
