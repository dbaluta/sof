CONFIG_IMX8M=y
CONFIG_HAVE_AGENT=n
CONFIG_FORMAT_CONVERT_HIFI3=n
CONFIG_KPB_FORCE_COPY_TYPE_NORMAL=n
CONFIG_DMA=y
CONFIG_DMA_NXP_SDMA=y
CONFIG_DAI_NXP_MICFIL=y
CONFIG_TRACE=n
CONFIG_SHARED_INTERRUPTS=y
CONFIG_ZEPHYR_NATIVE_DRIVERS=y
CONFIG_SAI_HAS_MCLK_CONFIG_OPTION=y
CONFIG_CLOCK_CONTROL_FIXED_RATE_CLOCK=y

# IPC4 (major version 4) support for i.MX8MP. Requires the matching IPC4
# capable rimage config (imx8m_ipc4.toml) and an IPC4 topology on the host.
CONFIG_IPC_MAJOR_4=y

# i.MX8MP HiFi4 is single core; cross-core streaming is not applicable.
CONFIG_CROSS_CORE_STREAM=n
