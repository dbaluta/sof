#
# Minimal DAI-only pipelines: just a dai-copier with its own scheduler.
#
# Used for platforms (e.g. i.MX SAI) where the DAI copier connects directly
# to a gain/host pipeline via a route, with no extra module-copier stage.
# Without wrapping the dai-copier in its own Object.Pipeline, it never gets
# a pipeline_id/scheduler and sof_complete() never calls ipc_setup() on it,
# leaving struct snd_sof_dai::private NULL (SOF_IPC4 "No private data found
# for DAI" at PCM hw_params time).
#
# Mirrors the reference split used by e.g.
# include/pipelines/cavs/mixout-gain-dai-copier-playback.conf: "type",
# audio format counts/pins and the format objects are fixed in the class
# body, while dai_index/dai_type/copier_type/stream_name/node_type must be
# supplied via an Object.Widget.dai-copier.1 override at the instantiation
# site. Setting those in the class body instead (or setting "type"/counts/
# pins again at the instantiation site) makes alsatplg silently drop the
# mandatory/immutable "uuid" tuple from the compiled widget - this was
# found the hard way, so don't restructure without re-checking with
# `alsatplg -d` that the compiled dai-copier tuple blob still has a uuid.
#
# Usage:
#
# Object.Pipeline.dai-copier-io-playback."N" {
# 	Object.Widget.dai-copier.1 {
# 		dai_index	$SAI_DAI_INDEX
# 		dai_type	"SAI"
# 		copier_type	"SAI"
# 		stream_name	$STREAM_CODEC_NAME
# 		node_type	$I2S_LINK_OUTPUT_CLASS
# 	}
# }
#
# Where N is the unique pipeline ID within the same alsaconf node.
#

<include/common/input_audio_format.conf>
<include/common/output_audio_format.conf>
<include/components/dai-copier.conf>
<include/components/pipeline.conf>

Class.Pipeline."dai-copier-io-playback" {

	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]

		unique	"instance"
	}

	Object.Widget {
		dai-copier."1" {
			type				dai_in
			direction			"playback"
			num_input_audio_formats	1
			num_output_audio_formats	1
			num_input_pins			1

			Object.Base.input_audio_format [
				{
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}

		pipeline."1" {
			priority	0
			lp_mode		0
		}
	}

	dynamic_pipeline 1
	time_domain	"timer"
}

Class.Pipeline."dai-copier-io-capture" {

	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]

		unique	"instance"
	}

	Object.Widget {
		dai-copier."1" {
			type				dai_out
			direction			"capture"
			num_input_audio_formats	1
			num_output_audio_formats	1
			num_output_pins			1

			Object.Base.input_audio_format [
				{
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}

		pipeline."1" {
			priority	0
			lp_mode		0
		}
	}

	dynamic_pipeline 1
	time_domain	"timer"
}
